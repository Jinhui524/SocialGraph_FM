[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "socialgraph-fm-api"
version = "0.1.0"
description = "Local API, governed LLM boundary, and static Web host for SocialGraph-FM."
readme = { text = "Torch-free FastAPI governance service for SocialGraph-FM.", content-type = "text/plain" }
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
socialgraph-api = "app.__main__:console_main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

# Define this package's lint boundary explicitly so the repository-level style
# configuration does not leak across the isolated API package boundary.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
