[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "socialgraph-fm-gfm"
version = "0.1.0"
description = "Contract-first, fail-closed infrastructure for SocialGraph-FM GFM experiments"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "SocialGraph-FM" }]
dependencies = [
  "numpy==2.3.3",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
cpu = [
  "ogb==1.3.6",
  "pyg-lib==0.6.0",
  "torch==2.8.0",
  "torch-geometric==2.8.0.post1",
]
cu130 = [
  "ogb==1.3.6",
  "pyg-lib==0.7.0",
  "torch==2.12.0",
  "torch-geometric==2.8.0.post1",
  "torch-scatter==2.1.2; platform_system == 'Linux'",
  "torch-sparse==0.6.18; platform_system == 'Linux'",
]
text = [
  "FlagEmbedding==1.4.0",
  "transformers==5.14.1",
]
dev = [
  "pytest==9.0.3",
  "ruff==0.13.2",
  "mypy==1.18.2",
]
# Compatibility aliases retained for existing developer commands.
test = [
  "pytest==9.0.3",
  "ruff==0.13.2",
  "mypy==1.18.2",
]
gfm-text = [
  "FlagEmbedding==1.4.0",
  "transformers==5.14.1",
]

[project.scripts]
socialgraph-gfm = "socialgraph_gfm.cli:main"
socialgraph-gfm-core-experiment = "socialgraph_gfm.core.experiment_cli:main"
socialgraph-gfm-core-serve = "socialgraph_gfm.core.inference_cli:main"
socialgraph-gfm-research = "socialgraph_gfm.research.cli:main"
socialgraph-gfm-global = "socialgraph_gfm.global_model.cli:main"
socialgraph-gfm-governance = "socialgraph_gfm.governance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/socialgraph_gfm"]

[tool.hatch.build.targets.wheel.force-include]
"constraints" = "socialgraph_gfm/resources/constraints"
"locks/runtime-lock-manifest.json" = "socialgraph_gfm/resources/runtime-lock-manifest.json"
"locks/windows-cpu.requirements.txt" = "socialgraph_gfm/resources/locks/windows-cpu.requirements.txt"
"locks/windows-cu130.requirements.txt" = "socialgraph_gfm/resources/locks/windows-cu130.requirements.txt"
"locks/windows-cu130-gfm.requirements.txt" = "socialgraph_gfm/resources/locks/windows-cu130-gfm.requirements.txt"
"locks/linux-cu130.requirements.txt" = "socialgraph_gfm/resources/locks/linux-cu130.requirements.txt"
"locks/cpu-ci.requirements.txt" = "socialgraph_gfm/resources/locks/cpu-ci.requirements.txt"
"locks/install-lock-manifest.json" = "socialgraph_gfm/resources/install-lock-manifest.json"
"locks/install-windows-x86_64-cpu-pt28.requirements.txt" = "socialgraph_gfm/resources/locks/install-windows-x86_64-cpu-pt28.requirements.txt"
"locks/install-linux-x86_64-cpu-pt28.requirements.txt" = "socialgraph_gfm/resources/locks/install-linux-x86_64-cpu-pt28.requirements.txt"
"locks/install-macos-arm64-cpu-pt28.requirements.txt" = "socialgraph_gfm/resources/locks/install-macos-arm64-cpu-pt28.requirements.txt"
"locks/install-windows-x86_64-cu130-pt212.requirements.txt" = "socialgraph_gfm/resources/locks/install-windows-x86_64-cu130-pt212.requirements.txt"
"locks/install-linux-x86_64-cu130-pt212.requirements.txt" = "socialgraph_gfm/resources/locks/install-linux-x86_64-cu130-pt212.requirements.txt"
"runtime-profiles.json" = "socialgraph_gfm/resources/runtime-profiles.json"
"install-profiles.json" = "socialgraph_gfm/resources/install-profiles.json"
"contracts/public-contracts.schema.json" = "socialgraph_gfm/resources/public-contracts.schema.json"
"contracts/public-contracts.full.schema.json" = "socialgraph_gfm/resources/public-contracts.full.schema.json"
"contracts/core-task-contract.json" = "socialgraph_gfm/resources/core-task-contract.json"
"contracts/core-readiness.json" = "socialgraph_gfm/resources/core-readiness.json"
"contracts/core-serving-registry.json" = "socialgraph_gfm/resources/core-serving-registry.json"
"contracts/core-serving-graph-catalog.json" = "socialgraph_gfm/resources/core-serving-graph-catalog.json"
"contracts/core-serving-control.json" = "socialgraph_gfm/resources/core-serving-control.json"
"configs/ogbl-collab-baseline.json" = "socialgraph_gfm/resources/configs/ogbl-collab-baseline.json"
"configs/socialgraph-core.json" = "socialgraph_gfm/resources/configs/socialgraph-core.json"
"configs/openalex-graph-ai.json" = "socialgraph_gfm/resources/configs/openalex-graph-ai.json"
"configs/socialgraph-research.json" = "socialgraph_gfm/resources/configs/socialgraph-research.json"
"configs/socialgraph-global.json" = "socialgraph_gfm/resources/configs/socialgraph-global.json"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disable_error_code = ["call-arg"]
