name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web test -- --reporter=dot
      - run: npm --prefix apps/web run test:benchmark-runner
      - run: npm run check:web-bundle
      - run: python -m pip install pytest==9.0.3
      - run: python -m pytest -q tests/test_web_bundle.py
      - run: npm --prefix apps/web exec -- playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e:offline

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check .
      - run: mypy --config-file ../../.github/mypy-api.ini app
      - run: pytest -vv --maxfail=1

  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.3 ruff==0.13.2 mypy==1.18.2
      - run: python scripts/socialgraph.py --help
      - run: python scripts/socialgraph.py onboard --help
      - run: python scripts/socialgraph.py configure-llm --help
      - run: python scripts/socialgraph.py start --help
      - run: python scripts/socialgraph.py stop --help
      - run: python scripts/socialgraph.py doctor --help
      - name: Probe Python from PowerShell 7
        shell: pwsh
        run: ./scripts/tests/NativeCommand.Tests.ps1
      - name: Probe Python from Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/tests/NativeCommand.Tests.ps1
      - run: python -m ruff check packages/runtime/src packages/runtime/tests scripts/socialgraph.py scripts/build-web-bundle.py scripts/refresh-runtime-manifest.py
      - run: python -m mypy --config-file .github/mypy-runtime.ini packages/runtime/src
      - run: python -m pytest --import-mode=importlib -vv --maxfail=1 tests/test_startup_scripts.py tests/test_mock_llm_provider.py tests/test_web_bundle.py packages/runtime/tests

  gfm-ubuntu-cpu:
    runs-on: ubuntu-latest
    env:
      SOCIALGRAPH_GOVERNANCE_SKILL_CATALOG: ${{ github.workspace }}/skills/governance/catalog.json
    defaults:
      run:
        working-directory: packages/gfm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/gfm/locks/cpu-ci.requirements.txt
      - run: >-
          pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          --find-links https://data.pyg.org/whl/torch-2.8.0+cpu.html
          -r locks/cpu-ci.requirements.txt
      - run: pip install . --no-deps --no-build-isolation
      - run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "${{ runner.temp }}/wheelhouse"
      - run: ruff check src tests
      - run: mypy --config-file ../../.github/mypy-gfm.ini src
      - run: pytest -vv -ra
      - run: python -m socialgraph_gfm.cli doctor --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: python -m socialgraph_gfm.cli smoke --fixture both --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: python -m socialgraph_gfm.cli preflight --root "${{ runner.temp }}/socialgraph-fm" --json

  gfm-windows-cpu:
    runs-on: windows-latest
    env:
      SOCIALGRAPH_GOVERNANCE_SKILL_CATALOG: ${{ github.workspace }}/skills/governance/catalog.json
    defaults:
      run:
        working-directory: packages/gfm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: >-
          .venv/Scripts/python.exe -m pip install
          --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          --find-links https://data.pyg.org/whl/torch-2.8.0+cpu.html
          -r locks/windows-cpu.requirements.txt
      - run: .venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation .
      - run: .venv/Scripts/python.exe -m pip check
      - run: .venv/Scripts/python.exe -m pytest -vv --maxfail=1 -ra
      - run: .venv/Scripts/python.exe -m socialgraph_gfm.cli doctor --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: .venv/Scripts/python.exe -m socialgraph_gfm.cli smoke --fixture both --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: .venv/Scripts/python.exe -m socialgraph_gfm.cli preflight --root "${{ runner.temp }}/socialgraph-fm" --json

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.3
      - shell: pwsh
        run: ./scripts/tests/NativeCommand.Tests.ps1
      - shell: pwsh
        run: ./scripts/publication-check.ps1 -RepositoryRoot .
      - run: >-
          python -m pytest -vv --maxfail=1
          tests/test_publication_policy.py
          tests/test_brand_policy.py
          tests/test_contract_mirrors.py
          tests/test_runtime_bundle.py
          tests/test_startup_scripts.py
          tests/test_web_bundle.py

  download-zip-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.0.3
      - name: Export and inspect a no-Git source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "SocialGraph-FM.zip"
          $download = Join-Path $env:RUNNER_TEMP "download-zip"
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -LiteralPath $archive -DestinationPath $download
          if (Test-Path -LiteralPath (Join-Path $download ".git")) {
            throw "Download ZIP unexpectedly contains Git metadata"
          }
          Push-Location $download
          try {
            python scripts/socialgraph.py --help
            python -m pytest -q tests/test_runtime_bundle.py tests/test_startup_scripts.py tests/test_web_bundle.py
          }
          finally {
            Pop-Location
          }

  clean-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Complete the single-environment CPU quickstart
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $mockPort = 18991
          $mockPython = (Get-Command python -ErrorAction Stop).Source
          $startParameters = @{
            FilePath = $mockPython
            ArgumentList = @("scripts/tests/mock_llm_provider.py", "--port", "$mockPort")
            PassThru = $true
          }
          if ($IsWindows) { $startParameters.WindowStyle = "Hidden" }
          $mockLlm = Start-Process @startParameters
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $ready = (Invoke-RestMethod "http://127.0.0.1:$mockPort/health").status -eq "ok"
              }
              catch { Start-Sleep -Milliseconds 250 }
              if ($ready) { break }
            }
            if (-not $ready) { throw "Mock LLM provider did not start" }

            "clean-runtime-placeholder" | python scripts/socialgraph.py onboard `
              --api-base "http://127.0.0.1:$mockPort/v1" `
              --model clean-runtime-model `
              --api-key-stdin
            if ($LASTEXITCODE -ne 0) { throw "Onboarding failed" }

            $profile = Get-Content ./var/config/runtime-profile.json -Raw | ConvertFrom-Json
            $runtimePython = [string]$profile.interpreter.path
            if (-not (Test-Path -LiteralPath $runtimePython)) { throw "Managed interpreter missing" }
            if ((Resolve-Path $runtimePython).Path -notlike "$(Resolve-Path ./var/runtime)*") {
              throw "Runtime interpreter is outside var/runtime"
            }
            & $runtimePython -c "import importlib.util; assert importlib.util.find_spec('ogb') is None; assert importlib.util.find_spec('torch') is not None; assert importlib.util.find_spec('torch_geometric') is not None; assert importlib.util.find_spec('pyg_lib') is not None"
            if ($LASTEXITCODE -ne 0) { throw "Runtime dependency boundary failed" }
            if (Test-Path ./apps/web/node_modules) { throw "Onboarding created node_modules" }
            if (-not (Test-Path ./var/web/client/index.html)) { throw "Prebuilt Web was not installed" }
            $privateNames = @(Get-Content ./var/config/socialgraph-api.env | ForEach-Object { ($_ -split '=', 2)[0] })
            if (Compare-Object $privateNames @("LLM_API_BASE", "LLM_MODEL", "LLM_API_KEY")) {
              throw "Private LLM config does not contain exactly three fields"
            }

            $env:LLM_API_KEY = "ambient-sentinel"
            $env:OPENAI_API_KEY = "ambient-sentinel"
            python scripts/socialgraph.py start
            if ($LASTEXITCODE -ne 0) { throw "Start failed" }

            $health = Invoke-RestMethod http://127.0.0.1:5173/api/v1/health
            $capabilities = Invoke-RestMethod http://127.0.0.1:5173/api/v1/capabilities
            $gfm = Invoke-RestMethod http://127.0.0.1:5173/api/v2/gfm/governance/health
            $assistant = Invoke-RestMethod http://127.0.0.1:5173/api/v2/gfm/governance/assistant/skills
            $skills = Invoke-RestMethod http://127.0.0.1:5173/api/v2/gfm/governance/skills
            $web = Invoke-WebRequest http://127.0.0.1:5173/
            if ($health.status -ne "ok") { throw "API health failed" }
            if (-not $capabilities.intentNormalization.configured -or
                $capabilities.intentNormalization.mode -ne "llm_required" -or
                $capabilities.intentNormalization.model -ne "clean-runtime-model") {
              throw "Required LLM capability mismatch"
            }
            if (-not $gfm.servingReady -or $gfm.device -ne "cpu") { throw "CPU GFM is not serving-ready" }
            $assistantNames = @(
              "answer_governance_question",
              "summarize_node_evidence",
              "generate_global_situation_report",
              "generate_account_evidence_report",
              "generate_coordination_report",
              "generate_case_review_draft"
            )
            if ($assistant.schemaVersion -ne "socialgraph-fm.product-skills.assistant/1.0" -or
                $assistant.catalogHash -notmatch '^[0-9a-f]{64}$' -or
                (@($assistant.items.name) -join ',') -ne ($assistantNames -join ',')) {
              throw "Assistant Skill catalog mismatch"
            }
            if (@($skills.items).Count -ne 8) { throw "Governance Skill catalog mismatch" }
            if ($web.StatusCode -ne 200 -or $web.Content -notmatch 'id="root"') {
              throw "Prebuilt Web is unavailable or invalid"
            }
            python scripts/socialgraph.py doctor --test-llm --full --json
            if ($LASTEXITCODE -ne 0) { throw "Full doctor failed" }
          }
          finally {
            python scripts/socialgraph.py stop
            if ($null -ne $mockLlm -and -not $mockLlm.HasExited) {
              Stop-Process -Id $mockLlm.Id -Force
            }
          }
          ./scripts/publication-check.ps1
          $dirty = @(git status --porcelain)
          if ($dirty.Count -ne 0) { throw "Quickstart changed tracked files: $($dirty -join ', ')" }
