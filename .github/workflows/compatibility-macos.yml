name: compatibility-macos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-macos-arm64:
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: python -c "import platform; assert platform.machine().lower() in {'arm64', 'aarch64'}"
      - run: python -m pip install pytest==9.0.3 ruff==0.13.2 mypy==1.18.2
      - run: python -m pip install --no-deps ./packages/runtime
      - shell: pwsh
        run: ./scripts/tests/NativeCommand.Tests.ps1
      - shell: pwsh
        run: ./scripts/tests/Startup.Tests.ps1
      - run: python -m pytest -vv --maxfail=1 tests/test_startup_scripts.py packages/runtime/tests
      - run: python scripts/socialgraph.py setup --help
      - run: node scripts/run-python-cli.mjs --help

  gfm-macos-arm64-cpu:
    continue-on-error: true
    runs-on: macos-15
    env:
      SOCIALGRAPH_GOVERNANCE_SKILL_CATALOG: ${{ github.workspace }}/skills/governance/catalog.json
    defaults:
      run:
        working-directory: packages/gfm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/gfm/locks/install-macos-arm64-cpu-pt28.requirements.txt
      - run: python -m venv .venv
      - run: >-
          .venv/bin/python -m pip install
          --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --find-links https://data.pyg.org/whl/torch-2.8.0+cpu.html
          -r locks/install-macos-arm64-cpu-pt28.requirements.txt
      - run: .venv/bin/python -m pip install --no-deps --no-build-isolation .
      - run: .venv/bin/python -m pip install pytest==9.0.3
      - run: .venv/bin/python -m pip check
      - run: .venv/bin/python -m pytest -vv --maxfail=1 -ra
      - run: .venv/bin/python -m socialgraph_gfm.cli doctor --device cpu --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: .venv/bin/python -m socialgraph_gfm.cli smoke --fixture both --device cpu --root "${{ runner.temp }}/socialgraph-fm" --json
      - run: .venv/bin/python -m socialgraph_gfm.cli preflight --device cpu --root "${{ runner.temp }}/socialgraph-fm" --json
