name: dependency-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  web-audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  api-audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip_audit --local

  gfm-audit:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gfm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/gfm/locks/cpu-ci.requirements.txt
      - run: >-
          pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          --find-links https://data.pyg.org/whl/torch-2.8.0+cpu.html
          -r locks/cpu-ci.requirements.txt
      - run: python -m pip_audit --local
