[mypy]
python_version = 3.12
ignore_missing_imports = True
disable_error_code = call-arg

[mypy-socialgraph_gfm.core.datasets.mat_worker,socialgraph_gfm.core.formal_preflight,socialgraph_gfm.core.local_experiments,socialgraph_gfm.core.promotion,socialgraph_gfm.core.safe_paths,socialgraph_gfm.gfm.corpus.common,socialgraph_gfm.governance.reviewed_cases,socialgraph_gfm.research.workflows.serve,socialgraph_gfm.smoke]
# These modules contain runtime-guarded Win32 calls. POSIX typeshed omits the
# corresponding attributes, so CI suppresses only those platform-stub errors.
disable_error_code = call-arg,attr-defined
